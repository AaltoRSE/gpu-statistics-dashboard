# Organisational names for the Groups tab. Hand-editable; reloaded on change.
# [schools]      PREFIX = SHORT | Full name        (longest prefix of a dept code wins)
# [departments]  CODE   = Name                     (osasto-tNNN)
# [units]        CODE   = Name | DEPT               (laitos-tNNNXX; empty name = show code)
# Unit DEPT = its Staff-OU parent that is a current department (osasto-t* on this host),
# else own prefix. At runtime a user's own osasto-t* group overrides DEPT.
# Regenerate from AD (not needed normally):
#   net ads search '(&(objectClass=organizationalUnit)(ou=T*))' ou description distinguishedName
#   net ads search '(|(cn=laitos-t*)(cn=osasto-t*))' cn description

