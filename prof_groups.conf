# Professor research groups — the Groups tab's classification data.
#
# Generated from AD dumps by `tools/build_prof_groups.py` (see README),
# then hand-editable: this file is committed and its edits go live on
# the next request (no restart). Sections:
#
# [schools]     PREFIX = SHORT | full name     (PREFIX matches the front
#               of a department code; SHORT is the filter/chart value)
# [departments] CODE = name | school PREFIX   (name from the AD
#               `department` attribute; the school key is a [schools]
#               prefix)
# [groups]      leader-user = Leader Name | DEPT | unit codes
#               (space-separated; the group reads the unit's NSS groups
#               laitos-<code> / <code>-staff / <code>-everyone; the
#               leader is always a member of their own group)
#
# A row with no unit codes still works: only its leader belongs. A
# professor the builder could not resolve is left as a commented line in
# the builder's output — uncomment and fill in their unit codes.

[schools]
T1 = CHEM | School of Chemical Engineering
T2 = ENG | School of Engineering
T3 = SCI | School of Science
T4 = ELEC | School of Electrical Engineering
T5 = Other | Legacy / university units
T6 = Other | Legacy / university units
A8 = ARTS | School of Arts, Design and Architecture
E7 = BIZ | School of Business

[departments]
T300 = Department of Computer Science | T3
T410 = Department of Electrical Engineering and Automation | T4
T412 = Department of Information and Communications Engineering | T4

