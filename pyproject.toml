[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-statistics"
version = "0.1.0"
description = "Triton GPU efficiency admin dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools]
py-modules = ["app", "cache", "config", "deps", "gpu_groups", "prom", "promql", "slurm", "sources"]
packages = ["api", "domain"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
